name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build app bundle
        run: ./build.sh
      - name: Smoke-test the MCP server
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | build/StickyMac.app/Contents/MacOS/StickyMac mcp | tee out.jsonl
          grep -q create_note out.jsonl
      - name: Zip
        run: cd build && ditto -c -k --keepParent StickyMac.app StickyMac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: StickyMac
          path: build/StickyMac.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 build/StickyMac.zip | tee build/StickyMac.zip.sha256
          gh release create "$GITHUB_REF_NAME" build/StickyMac.zip build/StickyMac.zip.sha256 \
            --title "StickyMac $GITHUB_REF_NAME" --notes-file .github/release-notes.md
